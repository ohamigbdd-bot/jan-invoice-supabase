<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>売上登録（Supabase）</title>
  <link rel="stylesheet" href="../ass/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- cache-busting param -->
  <script src="../ass/js/supa.js?v=20250822a"></script>
  <style>
    .error{color:#fca5a5}
    .success{color:#86efac}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="authbar">
        <span id="userEmail" class="small"></span>
        <a href="../index.html"><button>← Maxへ</button></a>
      </div>
      <h1>売上登録（Supabase）</h1>
      <div class="row">
        <div class="col-4">
          <label>チームキー</label>
          <input id="teamKey" placeholder="TEAM-2025"/>
        </div>
        <div class="col-4">
          <label>JANコード</label>
          <input id="jan" placeholder="13桁"/>
        </div>
        <div class="col-4">
          <label>売上番号</label>
          <input id="sales_no" placeholder="例: S1500000104"/>
        </div>
      </div>
      <div class="row">
        <div class="col-6">
          <label>取引先</label>
          <input id="partner" placeholder="株式会社〜"/>
        </div>
        <div class="col-6">
          <label>金額</label>
          <input id="amount" type="number" value="0"/>
        </div>
      </div>
      <div class="row">
        <div class="col">
          <button id="btnSave">保存</button>
          <button id="btnDelete">この売上番号のデータ削除</button>
          <button id="btnExport">Excel エクスポート</button>
          <div id="msg" class="small"></div>
        </div>
      </div>

      <h2>一括インポート（任意）</h2>
      <p class="small">テンプレ（UPLOAD_TEMP.xlsx）や <kbd>sales_data_export.xlsx</kbd> を読み込みます。</p>
      <input type="file" id="fileSales" accept=".xlsx,.xls" />
      <button id="btnImport">取込</button>
      <div id="impMsg" class="small"></div>
    </div>
  </div>
<script>
(async () => {
  const u = await supa.getUser?.();
  document.getElementById('userEmail').textContent = u ? (u.email||'') : '未ログイン（indexでログインしてください）';
})();

function val(id){ return (document.getElementById(id).value||'').trim(); }

document.getElementById('btnSave').addEventListener('click', async () => {
  try{
    const teamKey = val('teamKey');
    const jan = val('jan');
    const salesNo = val('sales_no');
    const partner = val('partner');
    const amount = Number(document.getElementById('amount').value||0);
    if (!teamKey || !jan || !salesNo){ alert('チームキー/JAN/売上番号は必須'); return; }
    await supa.addSales([{ jan, salesNo, partner, amount }], teamKey);
    document.getElementById('msg').innerHTML = '<span class="success">保存しました。</span>';
  }catch(e){
    document.getElementById('msg').innerHTML = '<span class="error">保存失敗: '+(e.message||e)+'</span>';
    console.error(e);
  }
});

document.getElementById('btnDelete').addEventListener('click', async () => {
  try{
    const teamKey = val('teamKey');
    const salesNo = val('sales_no');
    if (!teamKey || !salesNo){ alert('チームキー/売上番号を入力'); return; }
    await supa.deleteSalesBySalesNo(salesNo, teamKey);
    document.getElementById('msg').innerHTML = '<span class="success">削除しました。</span>';
  }catch(e){
    document.getElementById('msg').innerHTML = '<span class="error">削除失敗: '+(e.message||e)+'</span>';
    console.error(e);
  }
});

document.getElementById('btnExport').addEventListener('click', async () => {
  try{
    const teamKey = val('teamKey');
    if (!teamKey){ alert('チームキーを入力'); return; }
    const wb = await supa.exportSalesWorkbook(teamKey);
    supa.downloadWorkbook(wb, 'sales_data_export.xlsx');
  }catch(e){
    document.getElementById('msg').innerHTML = '<span class="error">エクスポート失敗: '+(e.message||e)+'</span>';
    console.error(e);
  }
});

document.getElementById('btnImport').addEventListener('click', async () => {
  const impMsg = document.getElementById('impMsg');
  try{
    const teamKey = val('teamKey');
    if (!teamKey){ alert('チームキーを入力'); return; }
    const salesNo = val('sales_no');
    const partner = val('partner');
    const file = document.getElementById('fileSales').files[0];
    if (!file){ alert('ファイルを選択してください'); return; }
    const n = await supa.importSalesItemsXlsx(file, teamKey, salesNo, partner);
    impMsg.innerHTML = '<span class="success">'+n+'件取り込みました。</span>';
  }catch(e){
    impMsg.innerHTML = '<span class="error">取込失敗: '+(e.message||e)+'</span>';
    console.error(e);
    alert('取込でエラー: '+(e.message||e)); // 念のため
  }
});
</script>
</body>
</html>
